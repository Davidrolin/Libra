<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Books - Libra</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        h1, h2 { color: #333; }
        form { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 30px; max-width: 500px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #2e7d32; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #1b5e20; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #f2f2f2; }
        .inline-form { display: inline-block; margin: 0; padding: 0; background: none; }
        .btn-delete { background-color: #c62828; }
        .btn-delete:hover { background-color: #8e0000; }
    </style>
</head>
<body>

<h1>My Book Library</h1>

<h2>Add New Book</h2>
<form th:action="@{/books/add}" method="post">
    <div class="form-group">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required>
    </div>
    <div class="form-group">
        <label for="author">Author:</label>
        <input type="text" id="author" name="author" required>
    </div>
    <div class="form-group">
        <label for="year">Publication Year (use negative for B.C.):</label>
        <input type="number" id="year" name="year" required>
    </div>
    <div class="form-group">
        <label for="genre">Genre:</label>
        <input type="text" id="genre" name="genre" required>
    </div>
    <button type="submit">Save Book</button>
</form>

<h2>All Books</h2>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Year</th>
        <th>Genre</th>
        <th>Status</th>
        <th>Rating</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.bookId}">1</td>
        <td th:text="${book.title}">Title</td>
        <td th:text="${book.author}">Author</td>
        <td th:text="${book.year < 0} ? ${-book.year} + ' B.C.' : ${book.year}">2024</td>
        <td th:text="${book.genre}">Genre</td>
        <td>
            <span th:if="${book.finished}">Read</span>
            <span th:unless="${book.finished}">Unread</span>
        </td>
        <td th:text="${book.rating > 0} ? ${book.rating} + ' / 5' : 'Not rated'">-</td>
        <td>
            <form th:action="@{/books/rate}" method="post" class="inline-form">
                <input type="hidden" name="bookId" th:value="${book.bookId}">
                <select name="rating" required>
                    <option value="1">1 Star</option>
                    <option value="2">2 Stars</option>
                    <option value="3">3 Stars</option>
                    <option value="4">4 Stars</option>
                    <option value="5">5 Stars</option>
                </select>
                <button type="submit">Rate</button>
            </form>

            <form th:action="@{/books/delete}" method="post" class="inline-form">
                <input type="hidden" name="bookId" th:value="${book.bookId}">
                <button type="submit" class="btn-delete">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
