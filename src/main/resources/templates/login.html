<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Logga in - Libra</title>
</head>
<body>
<h2>Logga in</h2>

<!-- Meddelande vid felaktig inloggning -->
<div th:if="${param.error}" style="color: red;">
    Felaktigt användarnamn eller lösenord.
</div>

<!-- Meddelande efter utloggning -->
<div th:if="${param.logout}" style="color: green;">
    Du har loggats ut.
</div>

<!-- Meddelande efter lyckad registrering -->
<div th:if="${param.registered}" style="color: green;">
    Registreringen lyckades! Du kan nu logga in.
</div>

<form th:action="@{/login}" method="post">
    <div>
        <label for="username">Användarnamn:</label>
        <input type="text" id="username" name="username" required autoFocus />
    </div>
    <div>
        <label for="password">Lösenord:</label>
        <input type="password" id="password" name="password" required />
    </div>
    <button type="submit">Logga in</button>
</form>

<p>Har du inget konto? <a th:href="@{/register}">Registrera dig här</a></p>
</body>
</html>
