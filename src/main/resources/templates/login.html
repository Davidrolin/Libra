<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Logga in - Libra</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f7fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 400px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            background-color: #2b6cb0;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2c5282;
        }
        .error-msg {
            color: #e53e3e;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #718096;
        }
        .register-link a {
            color: #2b6cb0;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2 style="margin-top: 0; color: #1a202c; text-align: center;">Logga in på Libra</h2>

    <div th:if="${param.error}" class="error-msg">
        Felaktigt användarnamn eller lösenord.
    </div>

    <div th:if="${param.logout}" style="color: #38a169; margin-bottom: 15px; font-size: 14px;">
        Du har loggats ut.
    </div>

    <div th:if="${param.registered}" style="color: #38a169; margin-bottom: 15px; font-size: 14px; text-align: center;">
        Ditt konto har skapats! Du kan nu logga in.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Användarnamn</label>
            <input type="text" id="username" name="username" required autofocus />
        </div>

        <div class="form-group">
            <label for="password">Lösenord</label>
            <input type="password" id="password" name="password" required />
        </div>

        <button type="submit">Logga in</button>
    </form>

    <div class="register-link">
        Har du inget konto? <a th:href="@{/register}">Skapa ett här</a>
    </div>
</div>

</body>
</html>
